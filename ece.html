<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ECE Books</title>
    <link rel="stylesheet" href="style-ece.css">
</head>
<body>

    <div class="catalogue-container">
        <div class="page-title">ECE Book Catalogue</div>

        <div class="div-table">
            <div class="table-row header-row">
                <div class="table-cell cell-image">Book Image</div>
                <div class="table-cell">Book Title</div>
                <div class="table-cell">Author</div>
                <div class="table-cell cell-price">Price</div>
                <div class="table-cell cell-action">Action</div>
            </div>

            <!-- Book 1 -->
            <div class="table-row">
                <div class="table-cell cell-image">
                    <img src="https://m.media-amazon.com/images/I/61S3y-CUnNL._AC_UF1000,1000_QL80_.jpg" alt="Digital Design">
                </div>
                <div class="table-cell">Digital Design</div>
                <div class="table-cell">M. Morris Mano</div>
                <div class="table-cell cell-price">₹550</div>
                <div class="table-cell cell-action"><button class="add-btn">Add to Cart</button></div>
            </div>

            <!-- Book 2 -->
            <div class="table-row">
                <div class="table-cell cell-image">
                    <img src="https://m.media-amazon.com/images/I/71Q2+a82z8L._AC_UF1000,1000_QL80_.jpg" alt="Microelectronic Circuits">
                </div>
                <div class="table-cell">Microelectronic Circuits</div>
                <div class="table-cell">Sedra & Smith</div>
                <div class="table-cell cell-price">₹720</div>
                <div class="table-cell cell-action"><button class="add-btn">Add to Cart</button></div>
            </div>

            <!-- Book 3 -->
            <div class="table-row">
                <div class="table-cell cell-image">
                    <img src="https://m.media-amazon.com/images/I/71I3fXl8l-L._AC_UF1000,1000_QL80_.jpg" alt="Signals and Systems">
                </div>
                <div class="table-cell">Signals & Systems</div>
                <div class="table-cell">Alan V. Oppenheim</div>
                <div class="table-cell cell-price">₹680</div>
                <div class="table-cell cell-action"><button class="add-btn">Add to Cart</button></div>
            </div>
        </div>
    </div>

</body>
</html>
