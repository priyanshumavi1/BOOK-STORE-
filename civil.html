<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CIVIL Books</title>
    <link rel="stylesheet" href="style-civil.css">
</head>
<body>

    <div class="catalogue-container">
        <div class="page-title">CIVIL Book Catalogue</div>

        <div class="div-table">
            <div class="table-row header-row">
                <div class="table-cell cell-image">Book Image</div>
                <div class="table-cell">Book Title</div>
                <div class="table-cell">Author</div>
                <div class="table-cell cell-price">Price</div>
                <div class="table-cell cell-action">Action</div>
            </div>

            <!-- Book 1 -->
            <div class="table-row">
                <div class="table-cell cell-image">
                    <img src="https://m.media-amazon.com/images/I/71-L6fJpYtL._AC_UF1000,1000_QL80_.jpg" alt="Structural Analysis">
                </div>
                <div class="table-cell">Structural Analysis</div>
                <div class="table-cell">R.C. Hibbeler</div>
                <div class="table-cell cell-price">₹650</div>
                <div class="table-cell cell-action"><button class="add-btn">Add to Cart</button></div>
            </div>

            <!-- Book 2 -->
            <div class="table-row">
                <div class="table-cell cell-image">
                    <img src="https://m.media-amazon.com/images/I/81I2Wk31FRL._AC_UF1000,1000_QL80_.jpg" alt="Surveying">
                </div>
                <div class="table-cell">Surveying Vol. 1</div>
                <div class="table-cell">B.C. Punmia</div>
                <div class="table-cell cell-price">₹480</div>
                <div class="table-cell cell-action"><button class="add-btn">Add to Cart</button></div>
            </div>

            <!-- Book 3 -->
            <div class="table-row">
                <div class="table-cell cell-image">
                    <img src="https://m.media-amazon.com/images/I/81g73dZf-AL._AC_UF1000,1000_QL80_.jpg" alt="Fluid Mechanics">
                </div>
                <div class="table-cell">Fluid Mechanics</div>
                <div class="table-cell">R.K. Bansal</div>
                <div class="table-cell cell-price">₹590</div>
                <div class="table-cell cell-action"><button class="add-btn">Add to Cart</button></div>
            </div>
        </div>
    </div>

</body>
</html>
