<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalogue</title>
    <link rel="stylesheet" href="style-catalogue.css">
</head>
<body>

    <div class="catalogue-container">
        <!-- Page Title using div -->
        <div class="page-title">Book Catalogue</div>

        <!-- Div-based Table Structure -->
        <div class="div-table">
            
            <!-- Header Row -->
            <div class="table-row header-row">
                <div class="table-cell cell-center">Book Image</div>
                <div class="table-cell">Book Title</div>
                <div class="table-cell">Author</div>
                <div class="table-cell">Price</div>
                <div class="table-cell cell-center">Action</div>
            </div>

            <!-- Row 1 -->
            <div class="table-row">
                <div class="table-cell cell-center">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='80' viewBox='0 0 60 80'><rect width='60' height='80' fill='%232c3e50'/><text x='30' y='45' fill='white' font-size='10' text-anchor='middle' font-family='sans-serif'>WEB TECH</text></svg>" alt="Web Technologies">
                </div>
                <div class="table-cell">Web Technologies</div>
                <div class="table-cell">Uttam K. Roy</div>
                <div class="table-cell">₹450</div>
                <div class="table-cell cell-center">
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="table-row">
                <div class="table-cell cell-center">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='80' viewBox='0 0 60 80'><rect width='60' height='80' fill='%2327ae60'/><text x='30' y='45' fill='white' font-size='10' text-anchor='middle' font-family='sans-serif'>DSA IN C</text></svg>" alt="Data Structures">
                </div>
                <div class="table-cell">Data Structures using C</div>
                <div class="table-cell">Reema Thareja</div>
                <div class="table-cell">₹500</div>
                <div class="table-cell cell-center">
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Row 3 -->
            <div class="table-row">
                <div class="table-cell cell-center">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='80' viewBox='0 0 60 80'><rect width='60' height='80' fill='%238e44ad'/><text x='30' y='45' fill='white' font-size='10' text-anchor='middle' font-family='sans-serif'>OS CONCEPTS</text></svg>" alt="Operating System">
                </div>
                <div class="table-cell">Operating System Concepts</div>
                <div class="table-cell">Silberschatz</div>
                <div class="table-cell">₹650</div>
                <div class="table-cell cell-center">
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
