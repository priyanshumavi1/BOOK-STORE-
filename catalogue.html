<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalogue</title>
    <link rel="stylesheet" href="style-catalogue.css">
</head>
<body>

    <div class="catalogue-container">
        <!-- Page Title using div -->
        <div class="page-title">Book Catalogue</div>

        <!-- Div-based Table Structure -->
        <div class="div-table">
            
            <!-- Header Row -->
            <div class="table-row header-row">
                <div class="table-cell cell-center">Book Image</div>
                <div class="table-cell">Book Title</div>
                <div class="table-cell">Author</div>
                <div class="table-cell">Price</div>
                <div class="table-cell cell-center">Action</div>
            </div>

            <!-- Row 1 -->
            <div class="table-row">
                <div class="table-cell cell-center">
                    <img src="https://cdn.dotpe.in/longtail/store-items/9236355/fl3mDp9H.webp" alt="Web Technologies">
                </div>
                <div class="table-cell">Web Technologies</div>
                <div class="table-cell">Uttam K. Roy</div>
                <div class="table-cell">₹450</div>
                <div class="table-cell cell-center">
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Row 2 -->
            <div class="table-row">
                <div class="table-cell cell-center">
                    <img src="https://cdn01.sapnaonline.com/product_media/9789354977190/md_9789354977190_131120241137522.jpg" alt="Data Structures">
                </div>
                <div class="table-cell">Data Structures using C</div>
                <div class="table-cell">Reema Thareja</div>
                <div class="table-cell">₹500</div>
                <div class="table-cell cell-center">
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Row 3 -->
            <div class="table-row">
                <div class="table-cell cell-center">
                    <img src="https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1387667734i/83833.jpg">
                </div>
                <div class="table-cell">Operating System Concepts</div>
                <div class="table-cell">Silberschatz</div>
                <div class="table-cell">₹650</div>
                <div class="table-cell cell-center">
                    <button class="add-btn">Add to Cart</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
