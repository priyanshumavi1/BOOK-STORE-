<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EEE Books</title>
    <link rel="stylesheet" href="style-eee.css">
</head>
<body>

    <div class="catalogue-container">
        <div class="page-title">EEE Book Catalogue</div>

        <div class="div-table">
            <div class="table-row header-row">
                <div class="table-cell cell-image">Book Image</div>
                <div class="table-cell">Book Title</div>
                <div class="table-cell">Author</div>
                <div class="table-cell cell-price">Price</div>
                <div class="table-cell cell-action">Action</div>
            </div>

            <!-- Book 1 -->
            <div class="table-row">
                <div class="table-cell cell-image">
                    <img src="https://m.media-amazon.com/images/I/81xU9d4q4gL._AC_UF1000,1000_QL80_.jpg" alt="Electric Machinery">
                </div>
                <div class="table-cell">Electric Machinery</div>
                <div class="table-cell">A.E. Fitzgerald</div>
                <div class="table-cell cell-price">₹600</div>
                <div class="table-cell cell-action"><button class="add-btn">Add to Cart</button></div>
            </div>

            <!-- Book 2 -->
            <div class="table-row">
                <div class="table-cell cell-image">
                    <img src="https://m.media-amazon.com/images/I/71R2o5A3mSL._AC_UF1000,1000_QL80_.jpg" alt="Power System Engineering">
                </div>
                <div class="table-cell">Power System Engineering</div>
                <div class="table-cell">I.J. Nagrath</div>
                <div class="table-cell cell-price">₹580</div>
                <div class="table-cell cell-action"><button class="add-btn">Add to Cart</button></div>
            </div>

            <!-- Book 3 -->
            <div class="table-row">
                <div class="table-cell cell-image">
                    <img src="https://m.media-amazon.com/images/I/81N6W2P-qTL._AC_UF1000,1000_QL80_.jpg" alt="Control Systems Engineering">
                </div>
                <div class="table-cell">Control Systems Engineering</div>
                <div class="table-cell">I.J. Nagrath & M. Gopal</div>
                <div class="table-cell cell-price">₹520</div>
                <div class="table-cell cell-action"><button class="add-btn">Add to Cart</button></div>
            </div>
        </div>
    </div>

</body>
</html>
